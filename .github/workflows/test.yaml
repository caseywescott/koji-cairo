name: Tests

on: [push, pull_request]

jobs:
  # The root koji library (scarb 2.11.4, as in /.tool-versions).
  koji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.11.4"
      - run: scarb test

  # Beast Engine v1/v2 (JS) and its golden fixtures.
  engine-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offchain/beast-sound
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: npm test
